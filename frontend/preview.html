<html lang="en" data-mybot-preview="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>mybot isolated template preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/playground-preview/main.tsx"></script>
  </body>
</html>
